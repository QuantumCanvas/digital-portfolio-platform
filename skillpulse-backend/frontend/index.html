<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillPulse — grow your skills with peers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#241553;--paper:#F3F0FF;--card:#fff;--line:#DCD5F5;--v:#6B4DFF;--vs:#EAE5FF;--c:#FF4F8B;--m:#10BF8A;--s:#FFD23F;--mu:#5A5382}
*{box-sizing:border-box;margin:0}
body{font:16px/1.6 'Nunito',system-ui,sans-serif;background:var(--paper) var(--doodle,none) 0 0/140px 140px;color:var(--ink)}
h1,h2,h3,.disp{font-family:'Fredoka','Nunito',sans-serif;letter-spacing:-.02em;line-height:1.12}
h1{font-size:clamp(28px,4vw,40px)}h2{font-size:20px}h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--v);outline-offset:2px}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--ink);color:#fff;position:sticky;top:0;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:4px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font:800 21px 'Fredoka';padding:0 10px 18px}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nb{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:none;border:0;color:#B9B7DA;cursor:pointer;text-align:left}
.nb:hover{background:#ffffff14;color:#fff}.nb.on{background:var(--v);color:#fff}
.nb svg,.brand svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chip{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:#ffffff12;font-size:13px}
.chip small{color:#B9B7DA;display:block}
main{padding:34px clamp(16px,4vw,44px) 60px;max-width:1120px;width:100%}
.av{width:40px;height:40px;border-radius:50%;background:var(--c) center/cover;color:#fff;display:inline-grid;place-items:center;font:700 14px 'Nunito';flex:none}
.av.lg{width:96px;height:96px;font-size:30px;border:4px solid #fff}.av.sm{width:30px;height:30px;font-size:11px}
.card{background:var(--card);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:20px;padding:22px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}
.mu{color:var(--mu);font-size:13px}.top{margin-bottom:26px}.top p{color:var(--mu);margin-top:6px}
.btn{border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;border-radius:999px;padding:9px 18px;background:var(--v);color:#fff;font-weight:700;cursor:pointer}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}.btn.gh{background:var(--vs);color:var(--v)}.btn.ok{background:var(--m)}.btn.sm{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
textarea{resize:vertical;min-height:80px}label{font-size:13px;font-weight:700;display:block;margin-bottom:4px}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--vs);color:var(--v);font-size:12px;font-weight:500}
.tag.k{background:#FFE9E4;color:#C7402A}.tag.g{background:#DDF6EE;color:#0B7A5D}.tag.y{background:#FFF1CF;color:#8A5F00}
.bar{height:8px;border-radius:9px;background:var(--vs);overflow:hidden}.bar i{display:block;height:100%;background:var(--v);border-radius:9px;transition:width .6s}
.bar.g i{background:var(--m)}
.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.trail{position:relative;padding-left:50px}.trail:before{content:"";position:absolute;left:19px;top:14px;bottom:14px;width:3px;background:repeating-linear-gradient(var(--line) 0 8px,transparent 8px 14px)}
.node{position:relative;margin-bottom:14px}
.dot{position:absolute;left:-49px;top:14px;width:26px;height:26px;border-radius:50%;background:#B9B5D3;border:4px solid var(--paper);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.st-mastered .dot{background:var(--m)}.st-in-progress .dot{background:var(--v)}.st-next .dot{background:var(--s);color:var(--ink)}
.node .hd{display:flex;justify-content:space-between;gap:10px;cursor:pointer;align-items:center;width:100%;background:none;border:0;text-align:left}
.det{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.det p{margin-bottom:10px}.res a{color:var(--v);font-weight:500}
.post .txt{white-space:pre-wrap;margin:12px 0}
.act{background:none;border:0;cursor:pointer;color:var(--mu);font-weight:700;padding:6px 10px;border-radius:999px}
.act:hover{background:var(--vs)}.act.on{color:var(--c);background:#FFE9E4}
.cm{padding:10px 12px;background:var(--paper);border-radius:12px;margin-top:8px;font-size:14px}
.cover{height:150px;border-radius:20px 20px 0 0;background:var(--ink) center/cover}
.pr{margin:-48px 22px 0;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pj img{width:100%;height:120px;object-fit:cover;border-radius:12px;background:var(--vs)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;z-index:99;box-shadow:0 8px 30px #171a3a44;max-width:90vw}
.toast.err{background:#C7402A}
.mod{position:fixed;inset:0;background:#171a3a99;z-index:50;display:grid;place-items:center;padding:16px;overflow:auto}
.mod>.card{max-width:640px;width:100%;max-height:92vh;overflow:auto}
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:var(--ink);color:#fff;padding:clamp(28px,6vw,72px);display:flex;flex-direction:column;justify-content:center;gap:22px}
.hero h1{font-size:clamp(34px,5vw,58px)}.hero p{color:#B9B7DA;max-width:46ch}
.af{padding:clamp(24px,6vw,72px);display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:480px;width:100%;margin:auto}
.stat{font:800 30px 'Fredoka'}
.empty{text-align:center;padding:36px;color:var(--mu);border:2px dashed var(--line);border-radius:20px}
@media(max-width:820px){
.shell{grid-template-columns:1fr}
.side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px}
.brand,.chip{display:none}.nav{flex-direction:row;justify-content:space-around}
.nb{flex-direction:column;gap:2px;font-size:10px;padding:6px 8px;align-items:center}
main{padding-bottom:100px}.auth{grid-template-columns:1fr}.hero{padding-bottom:36px}
}

.grid>.card:hover,.col>.card:hover,.node .card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.card{transition:transform .18s,box-shadow .18s}.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.pill,.tag{transition:transform .15s}.pill:hover,.tag:hover{transform:rotate(-2deg) scale(1.07)}.pill.on{box-shadow:2px 2px 0 var(--v)}
.nb:hover svg,.brand:hover svg{animation:wig .5s}.brand{cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--v);box-shadow:3px 3px 0 var(--v)}
.bar{border:2px solid var(--ink);height:12px}.bar i{background-image:linear-gradient(45deg,#fff5 25%,transparent 25% 50%,#fff5 50% 75%,transparent 75%);background-size:18px 18px;animation:stripe 1.2s linear infinite}.bar.g i{background-color:var(--m)}
.st-in-progress .dot{animation:pulse 1.6s infinite}
.hero{position:relative;overflow:hidden}.hero>*:not(.fl){position:relative;z-index:1}
.fl{position:absolute;font-size:36px;animation:float 6s ease-in-out infinite;cursor:pointer;user-select:none}.fl:hover{animation:wig .6s}
.in>*,.in .grid>*,.in .trail>*,.in .col>*{animation:rise .55s cubic-bezier(.2,.9,.3,1.25) both}
.in>*:nth-child(2),.in .grid>*:nth-child(2),.in .trail>*:nth-child(2),.in .col>*:nth-child(2){animation-delay:.08s}
.in>*:nth-child(3),.in .grid>*:nth-child(3),.in .trail>*:nth-child(3),.in .col>*:nth-child(3){animation-delay:.16s}
.in>*:nth-child(n+4),.in .grid>*:nth-child(n+4),.in .trail>*:nth-child(n+4),.in .col>*:nth-child(n+4){animation-delay:.24s}
.in .bar i{animation:grow .9s .25s cubic-bezier(.2,.8,.2,1) both,stripe 1.2s linear infinite}
.rd{transform-origin:160px 160px;animation:bloom .9s .2s cubic-bezier(.3,1.4,.5,1) both}
.toast{animation:tpop .35s cubic-bezier(.3,1.6,.5,1)}.mod>.card{animation:pop .3s cubic-bezier(.3,1.5,.5,1)}.act.on{animation:pop .3s}
.cf,.bs{position:fixed;pointer-events:none;z-index:120}.cf{width:10px;height:14px;top:-20px;animation:fall var(--t) ease-in forwards}.bs{font-size:22px;animation:burst .8s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
@keyframes tpop{from{opacity:0;transform:translateX(-50%) translateY(20px) scale(.8)}}
@keyframes grow{from{width:0}}@keyframes stripe{to{background-position:18px 0}}
@keyframes bloom{from{transform:scale(0);opacity:0}}
@keyframes wig{25%{transform:rotate(-14deg) scale(1.15)}75%{transform:rotate(14deg) scale(1.15)}}
@keyframes pulse{50%{box-shadow:0 0 0 8px #6B4DFF33}}
@keyframes float{50%{transform:translateY(-16px) rotate(8deg)}}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r))}}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}
.sbar{position:sticky;top:0;z-index:15;padding:0 0 18px;background:linear-gradient(var(--paper) 75%,transparent)}
.sbar input{border:2px solid var(--ink);border-radius:999px;padding:11px 20px;background:#fff}
#sr{position:absolute;left:0;right:0;top:54px}.srb{padding:8px;border-radius:16px}
.sri{display:flex;flex-direction:column;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:10px;cursor:pointer}.sri:hover{background:var(--vs)}
.fg{display:grid;grid-template-columns:230px minmax(0,1fr) 270px;gap:18px;align-items:start}.fg>aside{position:sticky;top:76px}
.cb{width:100%;cursor:pointer;font:inherit;color:inherit;text-align:left}
.av.md{width:60px;height:60px;font-size:20px;border:3px solid #fff}
button.tag{border:0;cursor:pointer;font:inherit;font-size:12px}
@media(max-width:1000px){.fg{grid-template-columns:minmax(0,1fr)}.fg>aside{display:none}}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}.shell,.auth{position:relative;z-index:1}
.bgi{position:absolute;left:var(--l);top:var(--t);font-size:30px;opacity:.15;animation:drift var(--d) ease-in-out infinite}
.cover{position:relative;overflow:hidden;height:170px}.cover:after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,#24155380)}
.cv-d{position:absolute;inset:0;background:var(--doodleW) 0 0/140px 140px;animation:pan 26s linear infinite}
.cvf{position:absolute;z-index:1;font-size:30px;animation:float 5s ease-in-out infinite;filter:drop-shadow(0 3px 0 #24155366)}
.pr{margin:-56px 22px 0;justify-content:space-between;position:relative;z-index:2}
.avb{background:none;border:0;padding:0;border-radius:50%;cursor:pointer}.avb:hover .av{animation:wig .6s}
.pst .stat{font-size:24px}
.sw input{position:absolute;opacity:0;width:0}.sw span{display:block;width:56px;height:34px;border-radius:10px;border:2px solid var(--ink);cursor:pointer;transition:transform .15s}
.sw:hover span{transform:scale(1.08) rotate(-2deg)}.sw input:checked+span{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--v)}.sw input:focus-visible+span{outline:3px solid var(--v);outline-offset:3px}
@keyframes drift{50%{transform:translate(22px,-34px) rotate(14deg)}}@keyframes pan{to{background-position:140px 140px}}
.lk{background:none;border:0;padding:0;cursor:pointer;font-weight:800;color:inherit;text-align:left}.lk:hover{color:var(--v);text-decoration:underline}
.g3.fx{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.bdg{background:var(--c);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:0 7px;line-height:18px;margin-left:auto}
a.btn{text-decoration:none;display:inline-block}.mo{display:none}
@media(max-width:820px){.nav{gap:0}.nb{position:relative;padding:6px 4px;font-size:9.5px;min-width:0}.side>[data-a=logout]{display:none}.mo{display:inline-block}.bdg{margin:0;position:absolute;top:0;right:0;transform:none;line-height:16px;font-size:10px;padding:0 5px}}
@media(prefers-reduced-motion:reduce){*,*:before{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div><div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={token:localStorage.getItem('sp_token'),me:null,view:'home',auth:'login',open:null,ex:{},tag:"",compose:false,cm:null,cat:'All',edit:false,vu:null,back:'peer',d:{roles:[],trends:[],circles:[],feed:[],peers:[],road:[],net:{connections:[],incoming:[],outgoing:[]}}};
const IC={home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',road:'M6 19a2 2 0 100-4 2 2 0 000 4zm12-10a2 2 0 100-4 2 2 0 000 4zM8 17h7a3 3 0 000-6H9a3 3 0 010-6h7',circ:'M9 11a3 3 0 100-6 3 3 0 000 6zm7 0a2.5 2.5 0 100-5M3 20c0-3 3-5 6-5s6 2 6 5m2-4c3 0 5 1.5 5 4',feed:'M4 5h16M4 10h16M4 15h10M4 20h7',peer:'M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z',net:'M8 12a3 3 0 100-6 3 3 0 000 6zm8 0a3 3 0 100-6 3 3 0 000 6zM2 20c0-3 3-5 6-5s6 2 6 5M14 15c3 0 8 1 8 5',trend:'M3 17l6-6 4 4 8-8M15 7h6v6',me:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c0-4 4-6 8-6s8 2 8 6'};
const ic=n=>`<svg viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
const NAV=[['home','Dashboard'],['road','Roadmap'],['circ','Circles'],['feed','Feed'],['peer','Peers'],['net','Network'],['trend','Trends'],['me','Profile']];
const CATS=['Update','Project Showcase','Skill Milestone','Peer Match Request','Question'];
const GLY={BrainCircuit:'◈',Cpu:'▣',Sparkles:'✦'};
const av=(n,u,c='')=>`<span class="av ${c}" style="${u?`background-image:url('${encodeURI(u).replace(/'/g,'%27')}')`:''}">${esc((n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase())}</span>`;
function toast(m,e){const t=$('#toast');t.innerHTML=`<div class="toast ${e?'err':''}" role="status">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML='',3200)}
async function api(p,o={}){const r=await fetch('/api'+p,{method:o.m||'GET',headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})},body:o.b?JSON.stringify(o.b):undefined});let d={};try{d=await r.json()}catch{}
 if(!r.ok){if(r.status==401&&S.token&&!o.na)out();throw new Error(d.error||d.msg||'Something went wrong')}return d}
const out=()=>{localStorage.removeItem('sp_token');S.token=null;S.me=null;render()};
const tryDo=async f=>{try{return await f()}catch(e){toast(e.message,1)}};
async function loadAll(){const id=S.me.targetRoleId;const [roles,trends,circles,feed,peers,road,net]=await Promise.all([api('/meta/target-roles'),api('/meta/market-trends'),api('/circles'),api('/feed?per_page=50'),api('/peers'),api('/roadmaps/'+id),api('/connections')]);
 Object.assign(S.d,{roles,trends,circles,feed:feed.posts,peers,road,net})}
async function boot(){if(S.token){try{S.me=await api('/auth/me');await loadAll()}catch{S.me=null}}S.fresh=1;render()}
async function refreshMe(){S.me=await api('/auth/me')}
function render(){const k={};document.querySelectorAll('[data-k]').forEach(e=>k[e.dataset.k]=e.value);const f=document.activeElement?.dataset?.k;
 $('#app').innerHTML=S.me?shell():authV();if(S.fresh){S.fresh=0;countUp()}
 for(const i in k){const e=document.querySelector(`[data-k="${i}"]`);if(e)e.value=k[i]}
 if(f)document.querySelector(`[data-k="${f}"]`)?.focus()}
function authV(){const L=S.auth=='login',R=S.d.roles.length?S.d.roles:[{id:'fullstack-ai',title:'Full-Stack AI Engineer'},{id:'cloud-architect',title:'Cloud Systems & DevOps Architect'},{id:'frontend-ux',title:'UI/UX & Systems Frontend Specialist'}];
 return `<div class="auth"><section class="hero"><span class="fl" data-a="fun" style="top:8%;right:12%">📚</span><span class="fl" data-a="fun" style="top:38%;right:6%;animation-delay:-2s">🚀</span><span class="fl" data-a="fun" style="bottom:10%;right:22%;animation-delay:-4s">💡</span><span class="fl" data-a="fun" style="bottom:24%;left:6%;animation-delay:-1s">🎧</span><span class="fl" data-a="fun" style="top:14%;left:44%;animation-delay:-3s">✏️</span><div class="brand" data-a="fun" style="padding:0">${ic('trend')} SkillPulse</div><h1>Know what to learn next, and who to build it with.</h1><p>Pick a target role, follow a roadmap that tracks real market demand, and pair up with peers whose strengths cover your gaps.</p></section>
 <form class="af" data-f="${L?'login':'reg'}"><h2>${L?'Welcome back':'Create your account'}</h2>
 ${L?'':`<div><label>Full name</label><input name="name" required></div><div><label>Username</label><input name="username" required pattern="[a-z0-9_]+" title="Lowercase letters, numbers and underscores"></div><div><label>Headline</label><input name="title" placeholder="Aspiring Builder"></div><div><label>Target role</label><input name="targetRoleId" placeholder="e.g. Full-Stack AI Engineer" maxlength="50"></div>`}
 <div><label>Email</label><input name="email" type="email" required></div><div><label>Password</label><input name="password" type="password" minlength="6" required></div>
 <button class="btn">${L?'Log in':'Create account'}</button>
 ${L?'<button type="button" class="btn gh" data-a="demo">Try the demo account (Maya)</button>':''}
 <p class="mu">${L?'New here?':'Already have an account?'} <a href="#" data-a="swap" style="color:var(--v);font-weight:700">${L?'Create an account':'Log in'}</a></p></form></div>`}
function shell(){const m=S.me,cur=S.view=='user'?S.back:S.view,inv=S.d.net.incoming.length;return `<div class="shell"><aside class="side"><div class="brand" data-a="fun" title="Psst… click me">${ic('trend')} SkillPulse</div><nav class="nav" aria-label="Main">${NAV.map(([k,l])=>`<button class="nb ${cur==k?'on':''}" data-a="nav" data-id="${k}" ${cur==k?'aria-current="page"':''}>${ic(k)}<span>${l}</span>${k=='net'&&inv?`<b class="bdg" aria-label="${inv} pending invitations">${inv}</b>`:''}</button>`).join('')}</nav>
 <div class="chip" data-a="nav" data-id="me" style="cursor:pointer">${av(m.name,m.avatar,'sm')}<div><b>${esc(m.name)}</b><small>Level ${m.level} · ${m.xp} XP</small></div></div><button class="nb" data-a="logout" style="font-size:13px">Log out</button></aside><main class="${S.fresh?'in':''}"><div class="sbar"><input id="q" data-k="q" type="search" placeholder="Search people, posts and circles" aria-label="Search" autocomplete="off"><div id="sr"></div></div>${V[S.view]()}</main></div>`}
const pct=(a,b)=>Math.max(2,Math.min(100,Math.round(a/b*100)));
function radar(sk){if(sk.length<3)return sk.map(s=>`<div class="mu">${esc(s.name)}</div><div class="bar"><i style="width:${s.score}%"></i></div>`).join('');
 const n=sk.length,C=160,R=100,pt=(i,r)=>[C+r*Math.sin(2*Math.PI*i/n),C-r*Math.cos(2*Math.PI*i/n)];
 const ring=f=>sk.map((_,i)=>pt(i,R*f).join(',')).join(' ');
 return `<svg viewBox="-60 0 440 320" role="img" aria-label="Skill radar chart" style="width:100%;max-width:380px;display:block;margin:auto">${[.25,.5,.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="#E4E0F3"/>`).join('')}
 ${sk.map((_,i)=>`<line x1="${C}" y1="${C}" x2="${pt(i,R)[0]}" y2="${pt(i,R)[1]}" stroke="#E4E0F3"/>`).join('')}
 <polygon class="rd" points="${sk.map((s,i)=>pt(i,R*s.score/100).join(',')).join(' ')}" fill="#6B4DFF40" stroke="#6B4DFF" stroke-width="2.5" stroke-linejoin="round"/>

 ${S.cm==p.id?`<div>${p.comments.map(c=>`<div class="cm"><button class="lk" data-a="peer" data-id="${c.authorId}">${esc(c.author)}</button> <span class="mu">${esc(c.timeAgo)}</span><br>${esc(c.text)}</div>`).join('')}<form class="row" data-f="comment" data-id="${p.id}" style="margin-top:10px"><input name="text" placeholder="Write a comment…" required aria-label="Comment" data-k="cmt"><button class="btn sm">Reply</button></form></div>`:''}</article>`}
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
function confetti(n=40){if(RM)return;const cs=['#6B4DFF','#FF4F8B','#FFD23F','#10BF8A','#38BDF8'];for(let i=0;i<n;i++){const d=document.createElement('i');d.className='cf';d.style.cssText=`left:${Math.random()*100}vw;background:${cs[i%5]};--x:${Math.random()*160-80}px;--r:${Math.random()*720-360}deg;--t:${1.6+Math.random()*1.6}s;border-radius:${i%3?'2px':'50%'}`;document.body.appendChild(d);setTimeout(()=>d.remove(),3400)}}
function burst(el,em='👏'){if(RM)return;const r=el.getBoundingClientRect();for(let i=0;i<7;i++){const s=document.createElement('span');s.className='bs';s.textContent=em;s.style.cssText=`left:${r.left+r.width/2}px;top:${r.top}px;--x:${Math.random()*120-60}px;--y:${-40-Math.random()*70}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}
function countUp(){if(RM)return;document.querySelectorAll('.stat').forEach(e=>{const m=e.textContent.match(/^\d+/);if(!m)return;const to=+m[0],rest=e.textContent.slice(m[0].length),t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/800);e.textContent=Math.round(to*(1-Math.pow(1-p,3)))+rest;if(p<1)requestAnimationFrame(f)})(t0)})}
const roleId=t=>{t=t.trim().toLowerCase();if(!t)return'fullstack-ai';const r=S.d.roles.find(r=>r.id==t||r.title.toLowerCase()==t)||S.d.roles.find(r=>r.title.toLowerCase().includes(t)||t.includes(r.title.toLowerCase()));return r?r.id:t.replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||'fullstack-ai'};
const conn=()=>S.d.net.connections.map(x=>x.id),isC=id=>conn().includes(+id);
const cst=id=>{id=+id;return isC(id)?'connected':S.d.net.incoming.some(x=>x.id==id)?'pending_in':S.d.net.outgoing.some(x=>x.id==id)?'pending_out':'none'};
const cbtn=id=>{const st=cst(id);return st=='connected'?`<button class="btn sm gh" data-a="cdel" data-id="${id}" title="Remove connection">✓ Connected</button>`
 :st=='pending_out'?`<button class="btn sm gh" data-a="ccancel" data-id="${id}" title="Cancel your request">Pending · Undo</button>`
 :st=='pending_in'?`<span class="row" style="gap:6px"><button class="btn ok sm" data-a="cacc" data-id="${id}">Accept</button><button class="btn sm gh" data-a="cdec" data-id="${id}">Decline</button></span>`
 :`<button class="btn sm" data-a="creq" data-id="${id}">+ Connect</button>`};
const hu=u=>/^https?:\/\//i.test(u||'')?u:'';
const sl=(k,v)=>{v=(v||'').trim();if(hu(v))return v;const h=v.replace(/^@/,'');if(/^[\w.-]{1,60}$/.test(h)){if(k=='github')return'https://github.com/'+h;if(k=='twitter')return'https://x.com/'+h}return k=='website'&&/^[\w.-]+\.[a-z]{2,}(\/\S*)?$/i.test(v)?'https://'+v:''};
const stag=m=>['github','twitter','website'].filter(k=>m.socials[k]).map(k=>{const u=sl(k,m.socials[k]);return u?`<a class="tag" href="${esc(u)}" target="_blank" rel="noopener">${k}: ${esc(m.socials[k])}</a>`:`<span class="tag">${k}: ${esc(m.socials[k])}</span>`}).join('');
const pcard=p=>`<div class="card col"><div class="row">${av(p.name,p.avatar)}<div style="min-width:0"><button class="lk" data-a="peer" data-id="${p.id}">${esc(p.name)}</button><div class="mu" style="line-height:1.3">${esc(p.title)} · Level ${p.level}</div></div></div><div class="row wrap"><button class="btn gh sm" data-a="peer" data-id="${p.id}">View profile</button>${cbtn(p.id)}</div></div>`;
async function netSync(){const[n,me]=await Promise.all([api('/connections'),api('/auth/me')]);S.d.net=n;S.me=me;if(S.view=='user'&&S.vu)S.vu=await api('/profile/'+S.vu.id);render()}
async function openUser(id){id=+id;if(id==S.me.id){S.view='me'}else{S.vu=await api('/profile/'+id);if(S.view!='user')S.back=['net','feed','home'].includes(S.view)?S.view:'peer';S.view='user'}S.edit=false;S.fresh=1;render();scrollTo(0,0)}
const sBar=m=>{const c=[[m.avatar,'Add a profile photo'],[m.bio,'Write a short bio'],[m.location,'Add your location'],[m.socials.github||m.socials.twitter||m.socials.website,'Link GitHub, Twitter or a website'],[m.skills.length>=3,'Add at least 3 skills'],[m.projects.length,'Showcase a project'],[m.portfolio&&m.portfolio.enabled,'Generate your portfolio page'],[m.title&&m.title!='Aspiring Builder','Update your headline']],d=c.filter(x=>x[0]).length,p=Math.round(d/c.length*100),t=(c.find(x=>!x[0])||[])[1];
 return `<div><div class="row sp"><b>Profile strength</b><b>${p}%</b></div><div class="bar g"><i style="width:${Math.max(3,p)}%"></i></div>${t?`<a href="#" class="mu" data-a="nav" data-id="me">Next: ${t}</a>`:'<span class="mu">All-star profile 🎉</span>'}</div>`};
function doSearch(){const q=($('#q')?.value||'').trim().toLowerCase(),o=$('#sr');if(!o)return;if(q.length<2){o.innerHTML='';return}const has=(s,a)=>(s+' '+a.join(' ')).toLowerCase().includes(q);
 const P=S.d.peers.filter(p=>has(p.name+' '+p.title,p.strongSkills)).slice(0,4),C=S.d.circles.filter(c=>has(c.name,c.tags)).slice(0,3),F=S.d.feed.filter(p=>has(p.content+' '+p.authorName,p.tags)).length;
 const it=(a,id,l,s)=>`<button class="sri" data-a="${a}" data-id="${esc(id)}"><b>${esc(l)}</b><span class="mu">${esc(s)}</span></button>`;
 o.innerHTML=`<div class="card srb">${P.length+C.length+F?P.map(p=>it('peer',p.id,p.name,p.title)).join('')+C.map(c=>it('circsel',c.id,c.name,'Circle')).join('')+(F?it('tag',q,F+' post'+(F>1?'s':'')+' matching "'+q+'"','Show in feed'):''):'<span class="mu" style="padding:8px">No matches</span>'}</div>`}
const doodle=(c,o)=>`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140' fill='none' stroke='${c}' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' opacity='${o}'><path d='M14 30l6 6m0-6l-6 6'/><circle cx='84' cy='22' r='6'/><path d='M40 92q6-10 12 0t12 0'/><path d='M104 84l10 16H94z'/><path d='M22 118h16m-8-8v16'/><rect x='70' y='60' width='14' height='14' rx='3'/><path d='M118 40l4 8 8 1-6 6 2 8-8-4-8 4 2-8-6-6 8-1z'/></svg>`)}")`;
const BN={grape:'linear-gradient(120deg,#6B4DFF,#FF4F8B)',sunset:'linear-gradient(120deg,#FF8A3D,#FF4F8B)',mint:'linear-gradient(120deg,#10BF8A,#38BDF8)',sky:'linear-gradient(120deg,#38BDF8,#6B4DFF)'};
const cb=u=>!u?BN.grape:u.startsWith('preset:')?(BN[u.slice(7)]||BN.grape):`center/cover url('${encodeURI(u).replace(/'/g,'%27')}')`;
const csv=s=>(s||'').split(',').map(x=>x.trim()).filter(Boolean);
const A={
 nav:e=>{S.view=e.dataset.id;S.edit=false;S.fresh=1;render();scrollTo(0,0)},
 swap:()=>{S.auth=S.auth=='login'?'reg':'login';render()},
 demo:()=>tryDo(()=>login({email:'maya@example.com',password:'password123'},'/auth/login')),
 logout:out,compose:()=>{S.compose=!S.compose;render();setTimeout(()=>document.querySelector('[data-k=pc]')?.focus(),0)},
 tag:e=>{S.tag=e.dataset.id.toLowerCase();S.cat='All';S.view='feed';S.fresh=1;render();scrollTo(0,0)},
 circsel:()=>{S.view='circ';S.fresh=1;render()},more:e=>{S.ex[e.dataset.id]=1;render()},
 share:e=>tryDo(async()=>{const p=S.d.feed.find(x=>x.id==e.dataset.id);await navigator.clipboard.writeText(`${p.authorName}: ${p.content}`);toast('Post copied to clipboard')}),
 creq:e=>tryDo(async()=>{burst(e,'🤝');const r=await api('/connections/request/'+e.dataset.id,{m:'POST'});await netSync();toast(r.status=='connected'?'You are now connected 🤝':'Connection request sent')}),
 cacc:e=>tryDo(async()=>{await api(`/connections/${e.dataset.id}/accept`,{m:'POST'});confetti(40);await netSync();toast('You are now connected 🤝')}),
 cdec:e=>tryDo(async()=>{await api(`/connections/${e.dataset.id}/decline`,{m:'POST'});await netSync();toast('Invitation declined')}),
 ccancel:e=>tryDo(async()=>{await api('/connections/'+e.dataset.id,{m:'DELETE'});await netSync();toast('Request cancelled')}),
 cdel:e=>tryDo(async()=>{if(!confirm('Remove this connection?'))return;await api('/connections/'+e.dataset.id,{m:'DELETE'});await netSync();toast('Connection removed')}),
 back:()=>{S.view=S.back||'peer';S.fresh=1;render();scrollTo(0,0)},
 pgen:()=>tryDo(async()=>{S.me=await api('/profile/me/portfolio',{m:'PUT',b:{enabled:true}});confetti(70);render();toast('Portfolio published 🎉')}),
 punpub:()=>tryDo(async()=>{if(!confirm('Unpublish your portfolio? Its link will stop working.'))return;S.me=await api('/profile/me/portfolio',{m:'PUT',b:{enabled:false}});render();toast('Portfolio unpublished')}),
 pth:e=>tryDo(async()=>{S.me=await api('/profile/me/portfolio',{m:'PUT',b:{theme:e.dataset.id}});render()}),
 pcopy:()=>tryDo(async()=>{await navigator.clipboard.writeText(location.origin+S.me.portfolio.path);toast('Portfolio link copied')}),
 fun:()=>confetti(80),cat:e=>{S.cat=e.dataset.id;render()},edit:()=>{S.edit=!S.edit;render()},
 node:e=>{S.open=S.open==e.dataset.id?null:e.dataset.id;render()},
 cm:e=>{S.cm=S.cm==e.dataset.id?null:+e.dataset.id;render()},
 close:()=>$('#modal').innerHTML='',
 role:e=>tryDo(async()=>{S.me=await api('/profile/me',{m:'PUT',b:{targetRoleId:e.dataset.id}});S.d.road=await api('/roadmaps/'+e.dataset.id);S.open=null;S.fresh=1;render()}),
 done:e=>tryDo(async()=>{const r=await api(`/roadmaps/${S.me.targetRoleId}/${e.dataset.id}/complete`,{m:'POST'});S.me=r.user;confetti(r.leveledUp?120:50);const[rd,f]=await Promise.all([api('/roadmaps/'+S.me.targetRoleId),api('/feed?per_page=50')]);S.d.road=rd;S.d.feed=f.posts;render();toast(r.leveledUp?`🎉 Level up! You are now level ${r.user.level} (+${r.xpGained} XP)`:`✅ Mastered! +${r.xpGained} XP`)}),
 join:e=>tryDo(async()=>{if(e.textContent.trim()=='Join')burst(e,'🎉');await api(`/circles/${e.dataset.id}/join`,{m:'POST'});S.d.circles=await api('/circles');render()}),
 clap:e=>tryDo(async()=>{if(!e.classList.contains('on'))burst(e);const r=await api(`/feed/${e.dataset.id}/clap`,{m:'POST'});Object.assign(S.d.feed.find(p=>p.id==e.dataset.id),r);render()}),
 rmpost:e=>tryDo(async()=>{if(!confirm('Delete this post?'))return;await api('/feed/'+e.dataset.id,{m:'DELETE'});S.d.feed=S.d.feed.filter(p=>p.id!=e.dataset.id);render()}),
 peer:e=>tryDo(()=>openUser(e.dataset.id)),
 rmskill:e=>tryDo(async()=>{await api('/profile/me/skills/'+e.dataset.id,{m:'DELETE'});await refreshMe();render()}),
 rmproj:e=>tryDo(async()=>{if(!confirm('Delete this project?'))return;await api('/profile/me/projects/'+e.dataset.id,{m:'DELETE'});await refreshMe();render()}),
 pclap:e=>tryDo(async()=>{if(!e.classList.contains('on'))burst(e);await api(`/profile/projects/${e.dataset.id}/clap`,{m:'POST'});if(e.dataset.peer)S.vu=await api('/profile/'+e.dataset.peer);else await refreshMe();render()})};
async function login(b,path){const r=await api(path,{m:'POST',b,na:1});S.token=r.token;localStorage.setItem('sp_token',r.token);S.me=r.user;S.view='home';await loadAll();S.fresh=1;render()}
const F={
 login:(f)=>login({email:f.email.value,password:f.password.value},'/auth/login'),
 reg:(f)=>login({name:f.name.value,username:f.username.value.toLowerCase(),title:f.title.value||undefined,targetRoleId:roleId(f.targetRoleId.value),email:f.email.value,password:f.password.value},'/auth/register'),
 post:async f=>{const b={content:f.content.value,category:f.category.value,tags:csv(f.tags.value)};if(f.url.value)b.link={title:f.url.value.replace(/^https?:\/\//,''),url:f.url.value};const p=await api('/feed',{m:'POST',b});S.d.feed.unshift(p);f.reset();S.compose=false;toast('Posted 🚀');render()},
 comment:async f=>{const c=await api(`/feed/${f.dataset.id}/comments`,{m:'POST',b:{text:f.text.value}});S.d.feed.find(p=>p.id==f.dataset.id).comments.push(c);render()},
 disc:async f=>{await api(`/circles/${f.dataset.id}/discussions`,{m:'POST',b:{title:f.title.value}});S.d.circles=await api('/circles');render();toast('Discussion started')},
 skill:async f=>{await api('/profile/me/skills',{m:'POST',b:{name:f.name.value.trim(),category:f.category.value||'General',score:+f.score.value}});await refreshMe();render()},
 proj:async f=>{await api('/profile/me/projects',{m:'POST',b:{title:f.title.value,tagline:f.tagline.value,demoUrl:f.demoUrl.value,repoUrl:f.repoUrl.value,tags:csv(f.tags.value)}});await refreshMe();render();toast('Project added')},
 prof:async f=>{S.me=await api('/profile/me',{m:'PUT',b:{name:f.name.value,title:f.title.value,location:f.location.value,avatar:f.avatar.value,coverImage:f.cover.value||S.me.coverImage,bio:f.bio.value,openForPeers:f.open.checked,socials:{github:f.github.value,twitter:f.twitter.value,website:f.website.value}}});S.edit=false;render();toast('Profile saved')}};
document.addEventListener('click',e=>{if(!e.target.closest('.sbar')){const o=$('#sr');if(o)o.innerHTML=''}const t=e.target.closest('[data-a]');if(!t||(t.classList.contains('mod')&&e.target!==t&&!e.target.closest('button')))return;if(t.tagName=='A')e.preventDefault();if(t.closest('#sr')){$('#q').value='';$('#sr').innerHTML=''}A[t.dataset.a]?.(t)});
document.addEventListener('input',e=>{if(e.target.id=='q')doSearch()});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();tryDo(()=>F[f.dataset.f](f))});
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('#modal').innerHTML=''});
document.documentElement.style.setProperty('--doodle',doodle('#6B4DFF',.11));document.documentElement.style.setProperty('--doodleW',doodle('#fff',.4));
$('#bg').innerHTML=['📚','✏️','💡','🚀','🎧','⭐','🧠','💻','🎯','☕','🎨','📐'].map((e,i)=>`<span class="bgi" style="--l:${(i*29+7)%92}%;--t:${(i*47+11)%88}%;--d:${9+i%5*2}s;animation-delay:-${i*1.3}s">${e}</span>`).join('');
api('/meta/target-roles',{na:1}).then(r=>S.d.roles=r).catch(()=>{}).finally(boot);
